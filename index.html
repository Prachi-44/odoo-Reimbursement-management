<!DOCTYPE html>
<html>
<head>
    <title>Reimbursement System</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
        }

        .navbar {
            background: #2c3e50;
            color: white;
            padding: 15px;
            font-size: 20px;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input, select, button {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background: #ecf0f1;
        }
    </style>
</head>

<body>

<div class="navbar">
    Reimbursement Management System
</div>

<div class="container">

    <!-- Submit Expense -->
    <div class="card">
        <h3>Submit Expense</h3>
        <input type="text" id="desc" placeholder="Description">
        <input type="number" id="amount" placeholder="Amount">
        <select id="category">
            <option>Food</option>
            <option>Travel</option>
        </select>
        <button onclick="addExpense()">Submit</button>
    </div>

    <!-- Expense List -->
    <div class="card">
        <h3>My Expenses</h3>
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="expenseTable"></tbody>
        </table>
    </div>

</div>

<script>
    let expenses = [];

    function addExpense() {
        let desc = document.getElementById("desc").value;
        let amount = document.getElementById("amount").value;

        let expense = {
            desc: desc,
            amount: amount,
            status: "Pending"
        };

        expenses.push(expense);
        displayExpenses();
    }

    function displayExpenses() {
        let table = document.getElementById("expenseTable");
        table.innerHTML = "";

        expenses.forEach(e => {
            table.innerHTML += `
                <tr>
                    <td>${e.desc}</td>
                    <td>${e.amount}</td>
                    <td>${e.status}</td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
